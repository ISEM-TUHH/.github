<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">ISEM – Institut für Smarte Entwicklung und Maschinenelemente, Technische Universität Hamburg</title>
<desc id="desc">Banner mit dem Institutsnamen, kämmenden Zahnrädern als Symbol für Maschinenelemente und einem Netz aus Knoten als Symbol für Software.</desc>
<style>
.ink{fill:#e6edf3}
.muted{fill:#9fb0c3}
.accent{fill:#38c9d8}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.gear{fill:#38c9d8;fill-opacity:0.07;stroke:#38c9d8;stroke-opacity:.75;stroke-width:1.5;fill-rule:evenodd;transform-box:fill-box;transform-origin:center}
.gear.b{stroke:#79a8f2;fill:#79a8f2}
.cl{stroke:#9fb0c3;stroke-opacity:.45;stroke-width:1;stroke-dasharray:14 3 2 3;fill:none}
.pitch{stroke:#38c9d8;stroke-opacity:.35;stroke-width:1;stroke-dasharray:2 4;fill:none}
.edge{stroke:#79a8f2;stroke-opacity:0.6;stroke-width:1.4;fill:none;stroke-dasharray:4 10;animation:flow 3.5s linear infinite}
.link{stroke:#38c9d8;stroke-opacity:.45;stroke-width:1.2;fill:none;stroke-dasharray:2 6;animation:flow 5s linear infinite}
.node{fill:#0d1117;stroke:#79a8f2;stroke-width:2;animation:pulse 4s ease-in-out infinite alternate}
.dim{stroke:#38c9d8;stroke-width:1.5;fill:none}
.dim-draw{stroke-dasharray:480;stroke-dashoffset:480;animation:draw 1.8s ease-out .3s forwards}
.sheen{animation:sheen 60s linear infinite}
.cw{animation:spin 64s linear infinite}
.ccw-b{animation:spin 40s linear infinite reverse}
.ccw-c{animation:spin 32s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{from{stroke-opacity:.45}to{stroke-opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sheen{to{transform:translateX(2400px)}}
@media (prefers-reduced-motion: reduce){
  .cw,.ccw-b,.ccw-c,.edge,.link,.node,.sheen{animation:none}
  .dim-draw{animation:none;stroke-dashoffset:0}
}
</style>
